version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      - DATABASE_URL=postgresql://ls_user:ls_password@database:5432/ls_enabler
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  database:
    image: postgres:15
    environment:
      - POSTGRES_DB=ls_enabler
      - POSTGRES_USER=ls_user
      - POSTGRES_PASSWORD=ls_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  postgres_data: